<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Lista de Usuários</title>
    <title>Editar Usuário</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Editar Usuário</h1>

        <form id="form-editar-usuario">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="editar_nome" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="editar_email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Idade</label>
                <input type="number" class="form-control" id="editar_idade" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Altura</label>
                <input type="number" class="form-control" id="editar_altura" step="0.01" required>
            </div>

            <button type="button" class="btn btn-primary" onclick="atualizarUsuario()">Salvar Alterações</button>
            <a href="usuarios.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="editarUsuario.js"></script>
</html>
