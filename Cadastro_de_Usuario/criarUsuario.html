<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Criar Usuários</title>
</head>
<body>
    <div class="container mt-5">
        <h1>Criar usuário</h1>

        <form id="form-usuario">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="usuario_nome" placeholder="Digite um nome..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="usuario_email" placeholder="Digite um email..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Idade</label>
                <input type="number" class="form-control" id="usuario_idade" placeholder="Digite uma idade..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Altura</label>
                <!-- Alterado para number com step para aceitar decimais corretamente -->
                <input type="number" class="form-control" id="usuario_altura" step="0.01" placeholder="Digite uma altura..." required>
            </div>

            <button type="button" class="btn btn-primary" onclick="criarUsuarios()">Cadastrar</button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Corrigido de scr para src -->
    <script src="criarUsuarios.js"></script>
</body>
</html>
