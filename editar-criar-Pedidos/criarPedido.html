<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Editar Pedido</title>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Editar Pedido</h1>

        <form id="form-editar-pedido">
            <div class="mb-3">
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-control" id="editar_quantidade" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Total</label>
                <input type="number" class="form-control" id="editar_total" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label">ID Usuário</label>
                <input type="number" class="form-control" id="editar_id_usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label">ID Produto</label>
                <input type="number" class="form-control" id="editar_id_produto" required>
            </div>

            <button type="button" class="btn btn-primary" onclick="atualizarPedido()">Salvar Alterações</button>
            <a href="pedidos.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

  
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="editarPedidos.js"></script>
</html>
