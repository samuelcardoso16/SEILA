<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">   
    <title>Editar Produto</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Editar Produto</h1>

        <form id="form-editar-produto">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="editar_nome" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" class="form-control" id="editar_preco" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-control" id="editar_quantidade" required>
            </div>

            <button type="button" class="btn btn-primary" onclick="atualizarProduto()">Salvar Alterações</button>
            <a href="produtos.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="editarProduto.js"></script>
</body>
</html>
