<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Criar Produto</title>
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Criar Produto</h1>

        <form id="form-produto">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="produto_nome" placeholder="Digite o nome do produto..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" class="form-control" id="produto_preco" step="0.01" placeholder="Digite o preço..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-control" id="produto_quantidade" placeholder="Digite a quantidade em estoque..." required>
            </div>

            <button type="button" class="btn btn-primary" onclick="criarProdutos()">Cadastrar Produto</button>
            <a href="produtos.html" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="criarProdutos.js"></script>
</body>
</html>
